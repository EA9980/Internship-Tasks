<!DOCTYPE html>
<html>
<head>
    <title>Display Data</title>
</head>
<body>

<h2>Stored Students</h2>

<table border="1">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Password</th>
    </tr>

    {% for i in data %}
    <tr>
        <td>{{ i.username }}</td>
        <td>{{ i.email }}</td>
        <td>{{ i.password }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
