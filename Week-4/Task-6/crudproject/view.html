<h2>Student List</h2>

<a href="/add/">Add Student</a>

<table border="1">

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Course</th>
<th>Edit</th>
<th>Delete</th>
</tr>

{% for s in students %}

<tr>
<td>{{s.id}}</td>
<td>{{s.name}}</td>
<td>{{s.email}}</td>
<td>{{s.course}}</td>

<td>
<a href="/edit/{{s.id}}">Edit</a>
</td>

<td>
<a href="/delete/{{s.id}}">Delete</a>
</td>

</tr>

{% endfor %}

</table>
